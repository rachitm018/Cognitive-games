  <path d="M50 42 C58 47 66 52 72 58" stroke="#7a3b10" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M50 62 C44 68 39 72 34 77" stroke="#7a3b10" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M50 62 C56 68 61 72 66 77" stroke="#7a3b10" stroke-width="1.1" fill="none" stroke-linecap="round"/>

