<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="leafGradYellow" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="45%" stop-color="#F5B93F"/>
      <stop offset="80%" stop-color="#E08A2B"/>
      <stop offset="100%" stop-color="#B5591A"/>
    </linearGradient>
    <radialGradient id="shineYellow" cx="30%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
